# Builds, signs and publishes the next ArmotuSitio IDE release when a PR from this repository is merged into main.
# The label probar-release on an open PR runs a rehearsal: same build, validation and signing, nothing committed or published.
# Setup and costs: docs/guia/07-releases.md. The manual recipe (./release.sh) remains available.
# Publication refuses to run while any workflow outside the ArmotuSitio allowlist is active.
name: ArmotuSitio Release
on:
  pull_request:
    types: [closed, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      store_release_tag:
        description: 'MSIX only: published stable tag (empty builds a full release)'
        required: false
        type: string
        default: ''
      store_check_only:
        description: 'Only sign in to Partner Center and show the Store status (no build, no submission)'
        required: false
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  # Only real triggers share the queue; an unrelated label or an unmerged close must never replace a pending release.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    || (github.event.action == 'labeled' && github.event.label.name == 'probar-release')) && 'ats-release' || format('ats-release-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  REHEARSAL: ${{ github.event.action == 'labeled' }}
jobs:
  prepare:
    # PRs from this repository only; fork PRs never build. The label sin-release opts a merged PR out.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.store_release_tag == '' && !inputs.store_check_only) || (github.event.pull_request.head.repo.full_name == github.repository && (
      (github.event.action == 'closed' && github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'sin-release'))
      || (github.event.action == 'labeled' && github.event.label.name == 'probar-release')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - name: Require the release signing key before hours of building
        env:
          HAS_SIGNING_KEY: ${{ secrets.ATS_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" != 'true' ]; then echo '::error::Configure the ATS_RELEASE_SIGNING_KEY secret (docs/guia/07-releases.md).'; exit 1; fi
      # Authenticode is optional (paid service): all four settings or none. The Store package is signed by the Store.
      - name: Check optional Windows Authenticode configuration
        env:
          ATS_WINDOWS_PUBLISHER: ${{ vars.ATS_WINDOWS_PUBLISHER }}
          ATS_SIGNING_ENDPOINT: ${{ vars.ATS_SIGNING_ENDPOINT }}
          ATS_SIGNING_ACCOUNT: ${{ vars.ATS_SIGNING_ACCOUNT }}
          ATS_SIGNING_PROFILE: ${{ vars.ATS_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in ATS_WINDOWS_PUBLISHER ATS_SIGNING_ENDPOINT ATS_SIGNING_ACCOUNT ATS_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo '::warning::Authenticode not configured: the direct Windows installer will be published unsigned (docs/guia/07-releases.md).'
          elif [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Partial Authenticode configuration, missing: ${missing[*]} (docs/guia/07-releases.md)."; exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.REHEARSAL == 'true' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate the reviewed release revision without changing main
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ats-release-ci.mts prepare ${{ env.REHEARSAL == 'true' && '--rehearsal' || '' }}
  linux:
    needs: prepare
    # Native runners per architecture: emulating arm64 on x64 would exceed the job time limit.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Free disk space for the VS Code build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .build/cache/linux/${{ matrix.arch }}
          key: ats-linux-${{ matrix.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml', 'remote/pnpm-lock.yaml', 'build/pnpm-lock.yaml', '**/pnpm-workspace.yaml') }}
      - name: Build isolated Ubuntu 22.04 artifacts
        env:
          ATS_LINUX_BIND_CACHE: '1'
          # Read-only token of this job, for the GitHub API rate limit of the sysroot download.
          ATS_LINUX_SYSROOT_TOKEN: ${{ github.token }}
        run: node scripts/ats-build-linux.mts --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ats-linux-${{ matrix.arch }}
          path: .build/releases/*
          if-no-files-found: error
          retention-days: 1
  windows-and-publish:
    needs: [prepare, linux]
    runs-on: windows-2022
    environment: windows-signing
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      ATS_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ATS_WINDOWS_PUBLISHER: ${{ vars.ATS_WINDOWS_PUBLISHER }}
    steps:
      - name: Require signing credentials before building
        if: vars.ATS_WINDOWS_PUBLISHER != ''
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.ATS_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.ATS_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ATS_SIGNING_CLIENT_SECRET }}
        run: |
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name in windows-signing environment" }
          }
      - name: Git identity for validation fixtures
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            **/node_modules
            .build/npm
          key: ats-windows-x64-${{ hashFiles('.nvmrc', 'package.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/.pnpmfile.mjs', 'extensions/armotusitio-ide/package-lock.json', 'build/npm/**') }}
      - name: Install the exact lockfiles
        shell: pwsh
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: 'true'
          VSCODE_ARCH: x64
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Same as upstream CI: authenticated downloads avoid the GitHub API rate limit of shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm run preinstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "pnpm install failed (attempt $attempt), retrying..."
            Start-Sleep -Seconds 10
          }
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ats-linux-*
          path: .build/releases
          merge-multiple: true
      - name: Install pinned Authenticode tools
        if: vars.ATS_WINDOWS_PUBLISHER != ''
        shell: pwsh
        run: |
          $toolsPath = Join-Path $env:RUNNER_TEMP 'ats-signing-tools'
          nuget install Microsoft.Windows.SDK.BuildTools -Version 10.0.26100.4188 -OutputDirectory $toolsPath -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget install Microsoft.ArtifactSigning.Client -Version 1.0.128 -OutputDirectory $toolsPath -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signTools = @(Get-ChildItem -LiteralPath $toolsPath -Recurse -Filter signtool.exe | Where-Object FullName -Match '[\\/]x64[\\/]')
          $signLibraries = @(Get-ChildItem -LiteralPath $toolsPath -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object FullName -Match '[\\/]x64[\\/]')
          if ($signTools.Count -ne 1 -or $signLibraries.Count -ne 1) { throw 'Ambiguous or missing x64 signing tools' }
          "ATS_SIGNTOOL=$($signTools[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ATS_SIGNING_DLIB=$($signLibraries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows client
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ secrets.ATS_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.ATS_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.ATS_SIGNING_CLIENT_SECRET }}
          ATS_SIGNING_ENDPOINT: ${{ vars.ATS_SIGNING_ENDPOINT }}
          ATS_SIGNING_ACCOUNT: ${{ vars.ATS_SIGNING_ACCOUNT }}
          ATS_SIGNING_PROFILE: ${{ vars.ATS_SIGNING_PROFILE }}
        run: node scripts/ats-package-windows.mts
      - name: Prepare release signing key
        shell: pwsh
        env:
          ATS_RELEASE_SIGNING_KEY: ${{ secrets.ATS_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:ATS_RELEASE_SIGNING_KEY) { throw 'Missing release signing key' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'ats-release-private.pem'
          [IO.File]::WriteAllText($keyPath, $env:ATS_RELEASE_SIGNING_KEY)
          "ATS_IDE_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate and sign
        shell: pwsh
        env:
          # The hosted Windows temp folder is an 8.3 short path; the checkpoint store requires canonical paths.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          node scripts/ats-autoupdate.mts validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ats-autoupdate.mts artifacts
          exit $LASTEXITCODE
      - name: Publish the prepared release
        if: env.REHEARSAL != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ats-autoupdate.mts publish --approve
          exit $LASTEXITCODE
      - name: Keep the rehearsal installers for a smoke test
        if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ats-rehearsal-windows
          path: .build/releases/*.exe
          if-no-files-found: error
          retention-days: 2
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'ats-release-private.pem'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
  store-msix:
    needs: [prepare, windows-and-publish]
    # A GITHUB_TOKEN-created release does not emit another workflow run: use the dependency path too.
    if: >-
      always() && !cancelled() && (
      (github.event_name == 'workflow_dispatch' && inputs.store_release_tag != '') ||
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (needs.windows-and-publish.result == 'success' && github.event.action != 'labeled'))
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ATS_STORE_RELEASE_TAG: ${{ inputs.store_release_tag || github.event.release.tag_name || needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Package the verified published ZIP for Microsoft Store
        shell: pwsh
        run: |
          node scripts/ats-store-release.mts "$env:ATS_STORE_RELEASE_TAG"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ats-store-msix-${{ github.run_id }}
          path: |
            .build/msix/*.msix
            .build/msix/*.msix.json
            .build/msix/ci-release.json
          if-no-files-found: error
          retention-days: 14
  store-submit:
    needs: store-msix
    # Opt-in: the repository variable ATS_STORE_PRODUCT_ID enables it; Partner Center credentials live in the
    # microsoft-store environment. Free Partner Center API access only; no paid service is involved.
    # store_check_only signs in and reports the Store status without packaging or submitting (credential check).
    if: >-
      always() && !cancelled() && vars.ATS_STORE_PRODUCT_ID != '' && (needs.store-msix.result == 'success'
      || (github.event_name == 'workflow_dispatch' && inputs.store_check_only))
    runs-on: windows-2022
    environment: microsoft-store
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ATS_STORE_PRODUCT_ID: ${{ vars.ATS_STORE_PRODUCT_ID }}
      STORE_CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.store_check_only }}
    steps:
      - name: Validate the Store product ID
        shell: pwsh
        run: |
          if ($env:ATS_STORE_PRODUCT_ID -cnotmatch '^[0-9A-Z]{12}$') { throw 'ATS_STORE_PRODUCT_ID must be the 12-character Store ID' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: env.STORE_CHECK_ONLY != 'true'
        with:
          name: ats-store-msix-${{ github.run_id }}
          path: ${{ runner.temp }}/ats-store-msix
      - name: Verify the MSIX against its packaging receipt
        if: env.STORE_CHECK_ONLY != 'true'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'ats-store-msix'
          $packages = @(Get-ChildItem -LiteralPath $directory -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX, found $($packages.Count)" }
          $receipt = Get-Content -LiteralPath ($packages[0].FullName + '.json') -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $receipt.packageSha256) { throw 'MSIX SHA256 does not match its packaging receipt' }
          "ATS_MSIX_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ATS_MSIX=$($packages[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Submitting $($packages[0].Name) (version $($receipt.version), sha256 $actual)"
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      - name: Sign in to Partner Center
        shell: pwsh
        env:
          ATS_STORE_TENANT_ID: ${{ secrets.ATS_STORE_TENANT_ID }}
          ATS_STORE_SELLER_ID: ${{ secrets.ATS_STORE_SELLER_ID }}
          ATS_STORE_CLIENT_ID: ${{ secrets.ATS_STORE_CLIENT_ID }}
          ATS_STORE_CLIENT_SECRET: ${{ secrets.ATS_STORE_CLIENT_SECRET }}
        run: |
          foreach ($name in @('ATS_STORE_TENANT_ID', 'ATS_STORE_SELLER_ID', 'ATS_STORE_CLIENT_ID', 'ATS_STORE_CLIENT_SECRET')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name in the microsoft-store environment (docs/guia/07-releases.md)" }
          }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore reconfigure --tenantId $env:ATS_STORE_TENANT_ID --sellerId $env:ATS_STORE_SELLER_ID --clientId $env:ATS_STORE_CLIENT_ID --clientSecret $env:ATS_STORE_CLIENT_SECRET
          exit $LASTEXITCODE
      - name: Submit the MSIX to Microsoft Store certification
        if: env.STORE_CHECK_ONLY != 'true'
        shell: pwsh
        run: |
          # Replaces any pending draft with this package and commits it to certification.
          msstore publish $env:ATS_MSIX_DIRECTORY --inputFile $env:ATS_MSIX --appId $env:ATS_STORE_PRODUCT_ID
          exit $LASTEXITCODE
      - name: Report the Store submission status
        shell: pwsh
        run: |
          msstore apps get $env:ATS_STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore submission status $env:ATS_STORE_PRODUCT_ID
          exit $LASTEXITCODE
