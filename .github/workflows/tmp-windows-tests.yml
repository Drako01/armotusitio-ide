name: tmp windows extension tests
on:
  pull_request:
    paths: ['.github/workflows/tmp-windows-tests.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Surface the swallowed session error
        working-directory: extensions/armotusitio-ide
        shell: bash
        run: |
          sed -i "s/const report = (folder: any, error: any) => {/&console.log(\"REPORT\", error);/" src/chat.ts
          grep -n "REPORT" src/chat.ts
          timeout 120 node --test --test-timeout=30000 --test-name-pattern="converse, revise" test/chat.test.cts 2>&1 | grep -B2 -A12 "REPORT" | head -60 || true
