name: tmp windows extension tests
on:
  pull_request:
    paths: ['.github/workflows/tmp-windows-tests.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Each extension test file with a hard timeout
        working-directory: extensions/armotusitio-ide
        shell: bash
        run: |
          for f in test/*.test.cts test/native-*.test.mts; do
            s=$SECONDS; timeout 240 node --test "$f" > "/tmp/out.txt" 2>&1; rc=$?
            echo "$f rc=$rc $((SECONDS-s))s"
            if [ $rc -ne 0 ]; then tail -40 /tmp/out.txt; fi
          done
