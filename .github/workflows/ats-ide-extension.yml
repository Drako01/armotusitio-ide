name: ATS IDE Extension
# The "ATS gate" job always reports a result, so it can be a required status check without blocking unrelated pull requests:
# a path filter on the trigger would leave the check "Expected" forever when nothing relevant changed.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ats-ide-extension-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # The classifier is executable policy: read it from the trusted base, never the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Detect changes to the ATS extension, its tooling or the toolchain
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" != 'pull_request' ]; then echo 'relevant=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          # During the first policy rollout, absence in the base enables all contracts.
          if [ ! -f scripts/ats-ci-changes.mts ]; then echo 'relevant=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api --paginate --slurp "$FILES_URL" > "$RUNNER_TEMP/ats-files.json"
          node scripts/ats-ci-changes.mts "$RUNNER_TEMP/ats-files.json" "$EXPECTED_FILES"
  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned TypeScript toolchain and Node types (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned offline PDF parser (no native optional dependencies)
        run: npm ci --prefix extensions/armotusitio-ide --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Syntax checks
        run: npm run check --prefix extensions/armotusitio-ide
      - name: Contract tests
        run: npm test --prefix extensions/armotusitio-ide
      - name: Release tooling tests
        run: node --test scripts/ats-release-ci.test.mts scripts/ats-ci-changes.test.mts
  # The extension runs on Windows, and Windows-only failures (the "Path" spelling of PowerShell, 8.3 temp folders, folders still held by
  # a child process) used to surface only in the release job, after an hour of compiling. Same shell as the release validation (pwsh).
  contract-windows:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned TypeScript toolchain and Node types (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned offline PDF parser on Windows
        run: npm ci --prefix extensions/armotusitio-ide --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Extension tests on Windows
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm test --prefix extensions/armotusitio-ide
      - name: Release tooling tests on Windows
        run: node --test scripts/ats-release-ci.test.mts scripts/ats-ci-changes.test.mts
  # Required status check. A skipped contract job is fine only when `changes` found nothing relevant; a failed, cancelled or
  # skipped-by-error dependency fails the gate.
  gate:
    name: ATS gate
    if: always()
    needs: [changes, contract, contract-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a real result
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CONTRACT: ${{ needs.contract.result }}
          CONTRACT_WINDOWS: ${{ needs.contract-windows.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT contract=$CONTRACT contract-windows=$CONTRACT_WINDOWS"
          [ "$CHANGES" = 'success' ] || { echo '::error::Change detection did not succeed.'; exit 1; }
          if [ "$RELEVANT" = 'true' ]; then
            [ "$CONTRACT" = 'success' ] || { echo '::error::Contract suite did not pass.'; exit 1; }
            [ "$CONTRACT_WINDOWS" = 'success' ] || { echo '::error::Windows contract suite did not pass.'; exit 1; }
          elif [ "$RELEVANT" = 'false' ]; then
            [ "$CONTRACT" = 'skipped' ] && [ "$CONTRACT_WINDOWS" = 'skipped' ] || { echo '::error::Contract suites should have been skipped.'; exit 1; }
          else
            echo '::error::Change detection returned an invalid classification.'; exit 1
          fi
