name: ATS IDE Extension
# The "ATS gate" job always reports a result, so it can be a required status check without blocking unrelated pull requests:
# a path filter on the trigger would leave the check "Expected" forever when nothing relevant changed.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ats-ide-extension-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect changes to the ATS extension, its tooling or the toolchain
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if [ "$EVENT" != 'pull_request' ]; then echo 'relevant=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "$FILES_URL" --jq '.[].filename')
          if echo "$files" | grep -Eq '^(extensions/armotusitio-ide/|scripts/ats-|release\.sh$|\.github/workflows/ats-|package(-lock)?\.json$|\.nvmrc$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi
  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned TypeScript toolchain and Node types (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check --prefix extensions/armotusitio-ide
      - name: Contract tests
        run: npm test --prefix extensions/armotusitio-ide
      - name: Release tooling tests
        run: node --test scripts/ats-release-ci.test.mts
  # Required status check. A skipped contract job is fine only when `changes` found nothing relevant; a failed, cancelled or
  # skipped-by-error dependency fails the gate.
  gate:
    name: ATS gate
    if: always()
    needs: [changes, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a real result
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          echo "changes=$CHANGES relevant=$RELEVANT contract=$CONTRACT"
          [ "$CHANGES" = 'success' ] || { echo '::error::Change detection did not succeed.'; exit 1; }
          if [ "$RELEVANT" = 'true' ]; then
            [ "$CONTRACT" = 'success' ] || { echo '::error::Contract suite did not pass.'; exit 1; }
          else
            [ "$CONTRACT" = 'skipped' ] || { echo '::error::Contract suite should have been skipped.'; exit 1; }
          fi
